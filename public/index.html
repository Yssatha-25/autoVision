<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Vision</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img id="fotoPerfil" class="avatar" src="assets/logo.png" alt="avatar">
        <div class="user-section oculta" id="userSection">
            <span id="nomeUsuario"></span>
            <button id="btnVerPerfil" class="btn-preto">Ver perfil</button>
        </div>

        <h1 class="empresa">Auto Vision</h1>

        <button id="btn-login" class="btn-preto">Entrar</button>
    </header>

    <main>
        <div id="busca" class="barra-busca">
            <input id="input-busca" type="text" placeholder="Digite o modelo do carro">
            <img src="assets/lupa.svg" alt="símbolo de uma lupa" class="icone-lupa">
        </div>
        <div id="vitrine" class="vitrine"></div>
    </main>

    <footer>
        <span>Auto Vision</span>
        <div class="redes">
            <img src="./assets/instagram.svg" alt="Logo do Instagram">
            <img src="./assets/tiktok.svg" alt="Logo do TikTok">
            <img src="./assets/linkedin.svg" alt="Logo do LinkedIn">
            <img src="./assets/youtube.svg" alt="Logo do Youtube">
        </div>
        <span>Copyright © 2026-2027 </span>
    </footer>

    <dialog id="modalLogin" class="overlay oculto">
        <div class="modal">
            <div class="modal-topo">
                <h2>Login</h2>
                <button id="fecharModal" class="btn-fechar">x</button>
            </div>

            <label for="loginUsuario"></label>
            <input type="text" name="loginUsuario" id="loginUsuario" placeholder="Digite seu nome">
            <span id="erroUsuario" class="erro"></span>
            
            <label for="loginSenha"></label>
            <input type="password" name="loginSenha" id="loginSenha" placeholder="Digite sua senha">
            <span id="erroSenha" class="erro"></span>
            
            <span id="erroLogin" class="erro"></span>

            <div class="modal-botoes">
                <button id="btnCancelar" class="btn-outline">Cancelar</button>
                <button id="btnConfirmarLogin" class="btn-preto">Login</button>
            </div>
        </div>
    </dialog>
</body>
</html>
